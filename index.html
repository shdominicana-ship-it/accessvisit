<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AccessVisit | Demo</title><style>*{box-sizing:border-box}body{margin:0;font:15px Segoe UI,Arial,sans-serif;color:#14253c;background:#f2f5fa}aside{position:fixed;inset:0 auto 0 0;width:245px;background:#09213d;color:white;padding:25px 15px;display:flex;flex-direction:column}h1,h2,h3{margin:0 0 15px}aside h1{font-size:27px}aside h1 span{color:#34a8ff}aside small{color:#b7cce4}nav{margin-top:30px;display:grid;gap:7px}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:12px 16px;background:#0868cc;color:white}nav button{background:transparent;text-align:left;color:white}nav button:hover,nav button.active{background:#0868cc}footer{margin-top:auto;font-size:13px;color:#b7cce4}main{margin-left:245px;padding:24px}.hero{padding:35px;background:linear-gradient(110deg,#0b2543,#1f6088);color:white;border-radius:15px;min-height:150px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0}.card,section{border-radius:14px;padding:20px;background:white;box-shadow:0 2px 12px #1529400b}.card b{font-size:32px;display:block;margin:8px 0}.card:nth-child(1){background:#e1edff}.card:nth-child(2){background:#e1f4e9}.card:nth-child(3){background:#fff0df}.card:nth-child(4){background:#ede5ff}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}section{margin-bottom:18px}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:13px 8px;border-bottom:1px solid #e5eaf0}th{color:#58708b;font-size:12px}label{display:block;margin:12px 0;color:#475b72}input,select{display:block;width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:7px;margin-top:5px;font:inherit}input[type=checkbox]{display:inline;width:auto} .ok{color:#087c49}.muted{color:#64748b}.notice{padding:10px 14px;background:#fff4d8;color:#795414;border-radius:8px;margin-bottom:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.chart{width:100%;height:190px} @media(max-width:800px){aside{position:static;width:auto}nav{grid-template-columns:repeat(2,1fr);margin:12px 0}main{margin:0;padding:12px}.cards,.grid{grid-template-columns:repeat(2,1fr)}section{overflow:auto}}@media(max-width:500px){.grid{grid-template-columns:1fr}.cards{gap:8px}.card{padding:12px}}</style><aside><h1>⬡ Access<span>Visit</span></h1><small>Control de visitantes</small><nav id="nav"></nav><footer>Creado por:<br><strong>Ing. Rafi Bautista</strong><br>V2.2 · Demostración</footer></aside><main><div class="notice">DEMO COMERCIAL · Datos ficticios · No introduzca datos personales reales · No conectado a equipos físicos</div><div id="view"></div></main><script>const names=['Dashboard','Nueva visita','Visitantes y QR','Terminales iDFace','Entradas y salidas','Historial de accesos','Reportes','Usuarios','Configuración'];const visitors=[['Carlos Martínez','Mantenimiento','Vigente','10:18'],['María Gómez','Reunión','Vigente','10:05'],['Ricardo Torres','Proveedor','Finalizada','09:42']];const devices=[['Baño','192.168.1.53','Interior'],['Entrada principal','192.168.1.50','Entrada'],['Área administrativa','192.168.1.51','Interior'],['Salida principal','192.168.1.52','Salida']];let current=0;let minutes=30;try{const n=Number(localStorage.getItem('av-demo-minutes'));if(n>=1&&n<=1440)minutes=n}catch(e){} const fmt=d=>d.toLocaleString('es-DO',{timeZone:'America/Santo_Domingo'});function saveMinutes(){const n=Number(document.getElementById('minutes').value);if(!Number.isInteger(n)||n<1||n>1440){alert('Introduce un número entero entre 1 y 1440.');return}minutes=n;try{localStorage.setItem('av-demo-minutes',String(n))}catch(e){}alert('Vigencia de demostración actualizada.')}function refreshTimes(){const a=document.getElementById('autoStart'),b=document.getElementById('autoEnd');if(a&&b){const now=new Date();a.textContent=fmt(now);b.textContent=fmt(new Date(+now+minutes*60000))}}setInterval(refreshTimes,1000);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const table=(heads,rows)=>'<table><thead><tr>'+heads.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';const field=(n,t='text')=>'<label>'+n+'<input type="'+t+'"></label>';const select=(n,opts)=>'<label>'+n+'<select>'+opts.map(x=>'<option>'+x+'</option>').join('')+'</select></label>';const btn=(n)=>'<button onclick="alert(\'Función ilustrativa: disponible en la aplicación local.\')">'+n+'</button>';const title=n=>'<h2>'+n+'</h2>';const visitTable=()=>table(['Visitante','Motivo','Estado','Hora'],visitors);function go(i){current=i;document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('active',i===j));let h='';if(i===0){h='<div class="hero"><h1>¡Hola, Administrador!</h1><p>Panel de control · Edificio corporativo</p><small>'+new Date().toLocaleDateString('es-DO',{timeZone:'America/Santo_Domingo'})+'</small></div><div class="cards">'+[['Visitas hoy','24'],['QR activos','18'],['Presencia estimada','7'],['Accesos registrados','56']].map(([n,v])=>'<div class="card">'+n+'<b>'+v+'</b><small>Datos ilustrativos</small></div>').join('')+'</div><div class="grid"><section><h3>Actividad de visitas</h3><svg class="chart" viewBox="0 0 400 180"><path d="M10 160H390 M10 120H390 M10 80H390 M10 40H390" stroke="#dce5ef" fill="none"/><path d="M10 150L60 125L110 100L160 35L210 90L260 120L310 130L390 120L390 160H10Z" fill="#dcecff"/><path d="M10 150L60 125L110 100L160 35L210 90L260 120L310 130L390 120" stroke="#0868cc" stroke-width="3" fill="none"/></svg></section><section><h3>Últimas visitas</h3>'+visitTable()+'</section><section><h3>Estado de terminales (simulado)</h3>'+table(['Terminal','IP','Estado'],devices.map(d=>[d[0],d[1],'Conectado (demo)']))+'</section><section><h3>Accesos rápidos</h3><div class="actions"><button onclick="go(1)">Registrar visita</button><button onclick="go(2)">Credenciales QR</button><button onclick="go(6)">Reportes</button></div></section></div>'}else if(i===1){h=title(names[i])+'<section><div class="grid"><div>'+field('Nombre y apellidos')+field('Cédula o pasaporte')+field('Teléfono')+field('Empresa')+'</div><div>'+field('Persona a visitar')+field('Motivo')+'<label>Fecha y hora automática <strong id="autoStart"></strong></label><label>Vigencia del QR: <strong>'+minutes+' minutos</strong></label><label>Vencimiento estimado <strong id="autoEnd"></strong></label>'+'</div></div><h3>Puertas autorizadas</h3>'+devices.map(d=>'<label><input type="checkbox"> '+d[0]+'</label>').join('')+'<div class="actions">'+btn('Escanear cédula')+btn('Capturar fotografía')+'<button onclick="alert(\'Simulación: el QR tendría una vigencia de '+minutes+' minutos desde su emisión. No autoriza puertas reales.\')">Registrar y generar QR (demo)</button>'+'</div></section>'}else if(i===2){h=title(names[i])+'<section>'+field('Buscar nombre o cédula')+visitTable()+'<div class="actions">'+btn('Ver pase QR')+btn('Revocar credencial')+btn('Compartir invitación')+'</div></section>'}else if(i===3){h=title(names[i])+'<section>'+table(['Terminal','IP','Función'],devices)+'</section><section><h3>Agregar terminal</h3><div class="grid"><div>'+field('Nombre del equipo')+field('Dirección IP')+field('Área')+'</div><div>'+select('Modelo',['iDFace','iDFace Max'])+select('Sentido',['Entrada','Salida','Interior'])+field('Usuario')+'</div></div><div class="actions">'+btn('Probar conexión')+btn('Consultar reglas')+btn('Guardar equipo')+'</div></section>'}else if(i===4||i===5){h=title(names[i])+'<section>'+table(['Visitante','Terminal','Movimiento','Hora'],[['Carlos Martínez','Entrada principal','Entrada autorizada','10:18'],['María Gómez','Entrada principal','Entrada autorizada','10:05'],['Ricardo Torres','Salida principal','Salida autorizada','09:42']])+'</section>'}else if(i===6){h=title(names[i])+'<section><div class="grid"><div>'+field('Desde','date')+select('Tipo',['Visitas','Eventos','Permanencia','Accesos denegados','Recurrentes'])+'</div><div>'+field('Hasta','date')+select('Terminal',['Todos',...devices.map(d=>d[0])])+'</div></div>'+field('Buscar visitante')+'<div class="actions"><button onclick="window.print()">Imprimir ejemplo</button>'+btn('Exportar PDF')+btn('Exportar Excel')+btn('Guardar en servidor')+btn('Reportes archivados')+'</div></section><section>'+visitTable()+'</section>'}else if(i===7){h=title(names[i])+'<section>'+table(['Usuario','Perfil','Estado'],[['admin','Administrador','Activo'],['recepcion01','Recepción','Activo'],['seguridad01','Seguridad','Activo'],['supervisor01','Supervisor','Activo'],['auditor01','Auditor','Activo']])+btn('Agregar usuario')+'</section>'}else{h=title(names[i])+'<section>'+field('Nombre de localidad')+field('Fotografía de localidad','file')+field('Carpeta de almacenamiento')+'<label>Vigencia de credenciales QR (minutos)<input id="minutes" type="number" min="1" max="1440" step="1" value="'+minutes+'"></label><button onclick="saveMinutes()">Guardar vigencia (demo)</button><p class="muted">Configuración simulada en este navegador. Valor inicial: 30 minutos.</p>'+'<label><input type="checkbox"> Reportes automáticos</label><div class="actions">'+btn('Guardar configuración')+btn('Crear respaldo')+btn('Diagnóstico')+'</div></section>'}document.getElementById('view').innerHTML=h;refreshTimes()}document.getElementById('nav').innerHTML=names.map((n,i)=>'<button onclick="go('+i+')">'+n+'</button>').join('');go(0);</script></html>
